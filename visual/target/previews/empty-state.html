<!doctype html><html lang="en" data-theme="light" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empty state</title><style>:root{--bg: 0 0% 100%;--fg: 240 10% 3.9%;--muted: 240 4.8% 95.9%;--muted-fg: 240 3.8% 46.1%;--accent: 240 4.8% 95.9%;--accent-fg: 240 5.9% 10%;--border: 240 5.9% 90%;--danger: 0 72% 51%;--ring: 240 5% 64.9%;--radius: 0.5rem;--density: 1;}:root{color-scheme:light dark}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:hsl(var(--bg));color:hsl(var(--fg))}.ferrum-dialog-backdrop{display:grid;place-items:center;min-height:100vh}.ferrum-dialog{padding:1.5rem;border-radius:var(--radius)}.ferrum-menu{display:inline-grid;gap:2px;padding:4px}.ferrum-menu-item{text-align:left}.ferrum-tablist{display:flex;gap:4px}.ferrum-tab[aria-selected=true]{font-weight:600}.ferrum-toast-region{display:grid;gap:8px}.ferrum-accordion{display:grid;gap:4px}.ferrum-accordion-trigger{width:100%;text-align:left}.ferrum-accordion-panel{padding:8px}.ferrum-alert{padding:12px;border:1px solid hsl(var(--border));border-radius:var(--radius)}.ferrum-avatar{display:inline-grid;place-items:center;border-radius:999px;background:hsl(var(--muted));color:hsl(var(--muted-fg))}.ferrum-avatar--sm{width:24px;height:24px}.ferrum-avatar--md{width:32px;height:32px}.ferrum-avatar--lg{width:40px;height:40px}.ferrum-badge{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid hsl(var(--border))}.ferrum-card{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:16px}.ferrum-card-header h2{margin:0}.ferrum-checkbox,.ferrum-input-label{display:grid;gap:4px}.ferrum-input{padding:6px 8px;border:1px solid hsl(var(--border));border-radius:var(--radius)}.ferrum-input.is-invalid{border-color:hsl(var(--danger))}.ferrum-progress{height:8px;background:hsl(var(--muted));border-radius:999px;overflow:hidden}.ferrum-progress-bar{height:100%;background:hsl(var(--ring))}.ferrum-separator{background:hsl(var(--border))}.ferrum-separator--horizontal{height:1px;width:100%}.ferrum-separator--vertical{width:1px;height:1rem}.ferrum-skeleton{background:hsl(var(--muted));border-radius:var(--radius)}.ferrum-breadcrumb-list{display:flex;gap:6px;list-style:none;padding:0}.ferrum-empty-state{padding:24px;text-align:center}.ferrum-kbd{border:1px solid hsl(var(--border));border-radius:4px;padding:1px 4px}.ferrum-label{font-size:.8rem}.ferrum-radio-group{display:grid;gap:4px}.ferrum-radio{display:flex;gap:6px;align-items:center}.ferrum-slider{display:grid;gap:4px}.ferrum-switch{display:inline-flex;gap:6px;align-items:center}.ferrum-switch-track{width:28px;height:16px;border-radius:999px;background:hsl(var(--muted))}.ferrum-textarea{padding:6px 8px;border:1px solid hsl(var(--border));border-radius:var(--radius)}.ferrum-tooltip{border-bottom:1px dotted hsl(var(--muted))}.ferrum-spinner-icon{display:inline-block;width:16px;height:16px;border:2px solid hsl(var(--border));border-top-color:hsl(var(--ring));border-radius:50%;animation:ferrum-spin .8s linear infinite}@keyframes ferrum-spin{to{transform:rotate(360deg)}}@media (prefers-color-scheme: dark){:root{--bg: 240 10% 3.9%;--fg: 0 0% 98%;--muted: 240 3.7% 15.9%;--muted-fg: 240 5% 64.9%;--accent: 240 3.7% 15.9%;--accent-fg: 0 0% 98%;--border: 240 3.7% 15.9%;--danger: 0 62.8% 45%;--ring: 240 4.9% 83.9%;--radius: 0.5rem;--density: 1;}}</style></head><body><section class="ferrum-empty-state"><h2>No results</h2><p>Try another filter</p></section></body></html>
