[workspace]
resolver = "2"
members = [
    "crates/ferrum-ui-core",
    "crates/ferrum-ui",
    "crates/ferrum-ui-ssr",
    "crates/ferrum-ui-native",
    "crates/ferrum-cli",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/ferrum-ui/ferrum-ui"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
nursery = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1